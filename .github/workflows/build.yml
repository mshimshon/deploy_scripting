name: Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - '*skipci*'

  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 👈 This forces GitHub to pull ALL history and tags
      
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get Last Version Tag
        id: get_last_version
        shell: bash
        run: |
          # 1. Create a safe temp file to capture the stdout string
          TEMP_TAG_OUT=$(mktemp)
          
          # 2. Run the script using explicit bash, redirecting standard output to our temp file
          "$GITHUB_WORKSPACE/utils/gitGetLatestRelease.sh" > "$TEMP_OUT"
          EXIT_CODE=$?

          # 3. Handle the explicit exit code requirements
          if [ $EXIT_CODE -eq 2 ]; then
            echo "Script returned exit code 2. Soft-handling: workflow will continue."
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Script failed with unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          fi

          # 4. Extract the clean result and push it out to the runner environment
          LATEST_TAG=$(cat "$TEMP_OUT" | tr -d '\r' | tail -n 1 | xargs)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT




